name: qa

# public 레포 규칙: pull_request 트리거를 쓰지 않는다. 외부 PR 이 secrets 나 AWS role 에 닿으면 안 된다.
on:
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST
  workflow_dispatch:
  repository_dispatch:
    types: [apk-uploaded]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: qa
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-northeast-2
      QA_BUCKET: ${{ secrets.QA_BUCKET }}
      QA_ACCOUNTS: ${{ secrets.QA_ACCOUNTS }}
      APK_VERSION: ${{ github.event.client_payload.apk_version || 'latest' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci

      - run: gh label create qa-fail --force --color B60205

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # 어르신은 사포리 앱(user.apk), 보호자·관리자는 사포리 관리자 앱(care.apk)
      - name: Download APKs
        run: |
          for a in user care; do
            aws s3 cp "s3://$QA_BUCKET/apk/$a.apk" "$a.apk" --no-progress --only-show-errors
          done

      # 버전과 해시를 고정해 GitHub 릴리스에서 직접 받는다. 설치 스크립트(curl | bash)는 내용이 바뀔 수 있고,
      # 다운로드가 깨져도(504) 성공으로 끝난 적이 있다. 프론트 E2E 와 같은 2.8.0 을 쓴다
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.8.0
          MAESTRO_SHA256: b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o maestro.zip             "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME" && rm maestro.zip
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
          "$HOME/maestro/bin/maestro" --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run scenarios on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r user.apk
            adb install -r care.apk
            node scripts/run.js
