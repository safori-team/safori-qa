name: deploy

on:
  push:
    branches: [main]
    paths: ["lambda/**", "shared/**", "web/**", "package-lock.json"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci && npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-2

      - name: Deploy Lambda
        run: |
          npm prune --omit=dev
          zip -qr function.zip lambda shared web node_modules package.json
          aws lambda update-function-code --function-name safori-qa --zip-file fileb://function.zip --output text --query LastUpdateStatus
